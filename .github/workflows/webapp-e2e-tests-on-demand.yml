name: WebApp E2E Tests On Demand

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version"
        type: choice
        required: true
        options:
          - "8.6"
          - "8.7"
          - "8.8"
          - "8.9"

permissions:
  contents: read

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.detect-base.outputs.base }}
      config_path: ${{ steps.detect-base.outputs.config_path }}
      non_standalone: ${{ steps.detect-base.outputs.non_standalone }}

    steps:
      - name: Detect base branch and config dir
        id: detect-base
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"

          case "$version" in
            "8.6") base="stable/8.6" ;;
            "8.7") base="stable/8.7" ;;
            "8.8") base="stable/8.8" ;;
            "8.9") base="main" ;;
            *) echo "Error: unsupported version '$version'"; exit 1 ;;
          esac

          echo "base=$base" >> "$GITHUB_OUTPUT"

          case "$version" in
            "8.6")
              cfg="fiori-app/webapp/config/8.6"
              non_standalone=true
              ;;
            "8.7")
              cfg="fiori-app/webapp/config/8.7"
              non_standalone=true
              ;;
            "8.8")
              cfg="fiori-app/webapp/config/8.8"
              non_standalone=false
              ;;
            "8.9")
              cfg="fiori-app/webapp/config/8.9"
              non_standalone=false
              ;;
          esac

          echo "config_path=$cfg" >> "$GITHUB_OUTPUT"
          echo "non_standalone=$non_standalone" >> "$GITHUB_OUTPUT"

          echo "Version input: $version"
          echo "Detected base: $base"
          echo "Using config path: $cfg"
          echo "NON_STANDALONE: $non_standalone"

  webapp-e2e-tests:
    name: WebApp E2E Tests (Tasklist ${{ matrix.tasklist_mode }} mode)
    needs: [validate-branch]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tasklist_mode: ${{ fromJSON((needs.validate-branch.outputs.base == 'stable/8.6' || needs.validate-branch.outputs.base == 'stable/8.7') && '["v1"]' || '["v2"]') }}
        #tasklist_mode: ${{ fromJSON((needs.validate-branch.outputs.base == 'stable/8.6' || needs.validate-branch.outputs.base == 'stable/8.7') && '["v1"]' || '["v1","v2"]') }}
    steps:
      - name: Print base branch and tasklist mode
        run: |
          echo "Base branch: ${{ needs.validate-branch.outputs.base }}"
          echo "Tasklist mode: ${{ matrix.tasklist_mode }}"
          echo "Config path: ${{ needs.validate-branch.outputs.config_path }}"
          echo "Non-standalone: ${{ needs.validate-branch.outputs.non_standalone }}"

      - uses: actions/checkout@v4

      - name: Export config variables
        shell: bash
        run: |
          echo "CONFIG_PATH=${{ needs.validate-branch.outputs.config_path }}" >> "$GITHUB_ENV"
          echo "NON_STANDALONE=${{ needs.validate-branch.outputs.non_standalone }}" >> "$GITHUB_ENV"

      - name: Start Camunda
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            echo "Using single services for older branches (8.6/8.7)"
            DATABASE=elasticsearch docker compose up -d operate tasklist
          else
            echo "Using standalone camunda container"
            if [[ "${{ matrix.tasklist_mode }}" == "v1" ]]; then
              echo "Starting with Tasklist V1 mode enabled"
              CAMUNDA_TASKLIST_V2_MODE_ENABLED=false DATABASE=elasticsearch docker compose up -d camunda
            else
              echo "Starting with default Tasklist V2 mode"
              DATABASE=elasticsearch docker compose up -d camunda
            fi
          fi
        working-directory: ${{ env.CONFIG_PATH }}

      - name: List running Docker containers
        run: docker ps -a
        working-directory: ${{ env.CONFIG_PATH }}

      - name: Wait for services to be ready
        id: wait-for-services
        run: |
          echo "Checking if services are up..."
          ready=false

          for i in {1..90}; do
            if [[ "$NON_STANDALONE" == "true" ]]; then
              tasklist_status=$(curl -s -m 5 http://localhost:8080 || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8081 || echo "Failed")
            else
              tasklist_status=$(curl -s -m 5 http://localhost:8080/tasklist || echo "Failed")
              operate_status=$(curl -s -m 5 http://localhost:8080/operate || echo "Failed")
              identity_status=$(curl -s -m 5 http://localhost:8080/identity || echo "Failed")
            fi

            if [[ "$NON_STANDALONE" == "true" ]]; then
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" ]]; then
                ready=true
                break
              fi
            else
              if [[ "$tasklist_status" != "Failed" && "$operate_status" != "Failed" && "$identity_status" != "Failed" ]]; then
                ready=true
                break
              fi
            fi

            echo "Waiting for services... ($i/90)"
            sleep 10
          done

          if [[ "$ready" == true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Services failed to start in time."
            exit 1
          fi
        working-directory: ${{ env.CONFIG_PATH }}

      - name: Print Docker logs before failing
        if: failure()
        run: |
          if [[ "$NON_STANDALONE" == "true" ]]; then
            docker compose logs tasklist
            docker compose logs operate
          else
            docker compose logs camunda
          fi
        working-directory: ${{ env.CONFIG_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          ACTIONS_STEP_DEBUG: 'false'

      - name: Clean install dependencies
        shell: bash
        run: |
          echo "Installing dependencies with npm ci..."
          npm ci --legacy-peer-deps 2>&1 | tail -20
          echo ""
          echo "Verifying critical binaries..."
          ls -la node_modules/.bin/ | grep -E "ui5|dev-approuter|c8ctl" || echo "Binaries not found"
          echo ""
          echo "Checking @ui5/cli installation..."
          ls -la node_modules/@ui5/cli/bin/ 2>/dev/null || echo "@ui5/cli bin directory not found"

      - name: start pg docker
        shell: bash
        run: cd ./test/docker/pg-standalone; docker compose up -d
        working-directory: ./

      - name: Install PostgreSQL client (psql)
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: ./

      - name: Prepare server
        shell: bash
        run: |
          echo "Setting up local development environment..."
          bash ./_misc/setup-local.sh
          echo "Setup completed successfully"
        working-directory: ./

      - name: Install Playwright Browsers
        shell: bash
        run: npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Run local webserver (background)
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting local webserver with debug output..."
          
          # Ensure node_modules/.bin is in PATH for npm-run-all to find binaries
          export PATH="$PWD/node_modules/.bin:$PATH"
          
          # Start router in background with full output capture
          npm run start:local 2>&1 | tee /tmp/web.log &
          WEB_PID=$!
          echo $WEB_PID > /tmp/web.pid
          echo "Webserver PID: $WEB_PID"
          sleep 5
          
          # Check if process is still alive
          if ! kill -0 $WEB_PID 2>/dev/null; then
            echo "ERROR: Webserver crashed!"
            echo "=== Last 100 lines from web.log ==="
            tail -n 100 /tmp/web.log || true
            exit 1
          fi
          
          # Poll for server readiness
          echo "Polling for server readiness..."
          for i in {1..30}; do
            if curl -s http://localhost:5001/ > /dev/null 2>&1; then
              echo "✓ Server responding on port 5001"
              break
            fi
            if ! kill -0 $WEB_PID 2>/dev/null; then
              echo "ERROR: Webserver died during startup"
              echo "=== Full web.log ==="
              cat /tmp/web.log || true
              exit 1
            fi
            echo "Wait $i/30..."
            sleep 2
          done
          
          # Verify server is responsive
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/app/index.html || echo "000")
          echo "Server HTTP response: $HTTP_CODE"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "304" ]]; then
            echo "ERROR: Server not responding correctly"
            curl -v http://localhost:5001/app/index.html || true
            exit 1
          fi
          echo "✓ Server is ready!"
        working-directory: ./

      - name: Deploy Camunda Test models
        shell: bash
        run: |
          # Verify webserver is still running before deploying
          if [[ -f /tmp/web.pid ]]; then
            WEB_PID=$(cat /tmp/web.pid)
            if ! kill -0 $WEB_PID 2>/dev/null; then
              echo "ERROR: Webserver died after startup!"
              echo "Last 100 lines from web.log:"
              tail -n 100 /tmp/web.log || true
              exit 1
            fi
            echo "✓ Webserver still running (PID: $WEB_PID)"
          fi
          
          # c8ctl is available via @camunda8/cli devDependency
          npm run e2e:test:deployForms
        working-directory: ./

      - name: Run E2E tests
        shell: bash
        env:
          CAMUNDA_AUTH_STRATEGY: "BASIC"
          CAMUNDA_BASIC_AUTH_USERNAME: "demo"
          CAMUNDA_BASIC_AUTH_PASSWORD: "demo"
          CAMUNDA_TASKLIST_V2_MODE_ENABLED: ${{ matrix.tasklist_mode == 'v2' && 'true' || 'false' }}
        run: |
          # Final check before tests
          if [[ -f /tmp/web.pid ]]; then
            WEB_PID=$(cat /tmp/web.pid)
            if ! kill -0 $WEB_PID 2>/dev/null; then
              echo "ERROR: Webserver not running before tests!"
              echo "Last 100 lines from web.log:"
              tail -n 100 /tmp/web.log || true
              exit 1
            fi
            echo "✓ Webserver confirmed running (PID: $WEB_PID)"
          fi
          
          # Test connectivity
          echo "Testing server connectivity..."
          curl -I http://localhost:5001/app/index.html || {
            echo "ERROR: Cannot reach webserver!"
            echo "Network status:"
            netstat -tuln | grep 5001 || echo "Port 5001 not listening"
            exit 1
          }
          
          echo "Starting E2E tests..."
          npm run e2e:test

      - name: Stop local webserver
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/web.pid ]]; then
            kill $(cat /tmp/web.pid) || true
          fi
          pkill -f "npm run start:local" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SAP BTP Plugin Fiori App (Tasklist ${{ matrix.tasklist_mode }} mode)
          path: fiori-app/webapp/html-report
          retention-days: 10