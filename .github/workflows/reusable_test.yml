# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: reusable_test

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  core-and-tasklist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: use node ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Workaround npm optional dependencies bug (rollup)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              ROLLUP_PKG="@rollup/rollup-linux-x64-gnu"
              ;;
            macOS)
              if [[ "$(uname -m)" == "arm64" ]]; then
                ROLLUP_PKG="@rollup/rollup-darwin-arm64"
              else
                ROLLUP_PKG="@rollup/rollup-darwin-x64"
              fi
              ;;
            Windows)
              ROLLUP_PKG="@rollup/rollup-win32-x64-msvc"
              ;;
            *)
              echo "Unsupported runner OS: ${{ runner.os }}" >&2
              exit 1
              ;;
          esac

          echo "Installing $ROLLUP_PKG"
          npm i --no-save "$ROLLUP_PKG"
      
      - name: test backend
        run: cd core && npx @cap-js/cds-typer "*" && DISABLE_CAMUNDA=true npm test

      - name: test "sap tasklist" rendering
        run: |
          cd fiori-app
          npm run test:e2e          

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ inputs.node-version }}
          path: fiori-app/webapp/test/e2e/__screenshots__